<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biology Study Quiz</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f8;color:#182126;margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e6;border-radius:16px;padding:20px}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:#0f766e;color:#fff}.btn.alt{background:#fff;color:#182126;border:1px solid #dde3e6}.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #ccd5d9;border-radius:11px;background:#fff}.opt.sel{border-color:#0f766e;background:#e6f4f1}.opt.good{border-color:#16794a;background:#e9f7ef}.opt.bad{border-color:#b42318;background:#fdf0ef}.muted{color:#66737b}.bar{height:7px;background:#e5eaec;border-radius:99px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#0f766e}.review{border-top:1px solid #ddd;padding:12px 0}select,label{font-size:16px}select{padding:9px}h1{margin-top:0}</style></head><body><div class="wrap"><div id="setup" class="card"><h1>Biology Study Quiz</h1><p class="muted">Random practice from the full 200-question bank.</p><p><label>Questions: <select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option><option>200</option></select></label></p><p><label><input id="shuffle" type="checkbox" checked> Shuffle answers</label></p><p><label><input id="instant" type="checkbox" checked> Show answer immediately</label></p><button class="btn" id="start">Start random quiz</button></div><div id="quiz" class="card hidden"><div id="meta" class="muted"></div><div class="bar"><div id="bar"></div></div><h2 id="q"></h2><div id="opts"></div><p id="fb"></p><div class="row"><button class="btn alt" id="prev">Previous</button><button class="btn" id="next">Next</button><button class="btn hidden" id="finish">Finish</button></div></div><div id="results" class="card hidden"><h1 id="score"></h1><p id="summary"></p><div class="row"><button class="btn" id="again">New quiz</button><button class="btn alt" id="retry">Retry missed</button></div><div id="review"></div></div></div><script src="bank1.js"></script><script src="bank2.js"></script><script src="bank3.js"></script><script src="bank4.js"></script><script>const $=x=>document.getElementById(x),L=['A','B','C','D'];let S={items:[],i:0,a:[],r:[]};function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(x){['setup','quiz','results'].forEach(y=>$(y).classList.toggle('hidden',x!==y))}function make(src,n){return sh(src).slice(0,n).map(q=>{let c=q.options.map((t,o)=>({t,o}));if($('shuffle').checked)c=sh(c);return {...q,c,cp:c.findIndex(x=>x.o===q.correct)}})}function start(src=window.BANK,n=+$('count').value){S={items:make(src,Math.min(n,src.length)),i:0,a:Array(Math.min(n,src.length)).fill(null),r:Array(Math.min(n,src.length)).fill(false)};show('quiz');render()}function render(){let q=S.items[S.i],a=S.a[S.i],ins=$('instant').checked;$('meta').textContent=`Question ${S.i+1} of ${S.items.length} · Original #${q.id}`;$('bar').style.width=((S.i+1)/S.items.length*100)+'%';$('q').textContent=q.question;$('opts').innerHTML='';q.c.forEach((c,i)=>{let b=document.createElement('button');b.className='opt'+(a===i?' sel':'');b.textContent=`${L[i]}. ${c.t}`;if(ins&&S.r[S.i]){b.disabled=true;if(i===q.cp)b.classList.add('good');if(i===a&&i!==q.cp)b.classList.add('bad')}b.onclick=()=>{S.a[S.i]=i;if(ins)S.r[S.i]=true;render()};$('opts').appendChild(b)});$('fb').textContent=ins&&S.r[S.i]?(a===q.cp?'Correct.':`Correct answer: ${L[q.cp]}. ${q.c[q.cp].t}`):'';$('prev').disabled=S.i===0;$('next').classList.toggle('hidden',S.i===S.items.length-1);$('finish').classList.toggle('hidden',S.i!==S.items.length-1)}function finish(){let c=0,w=0,b=0;S.a.forEach((a,i)=>a==null?b++:a===S.items[i].cp?c++:w++);$('score').textContent=Math.round(c/S.items.length*100)+'%';$('summary').textContent=`${c} correct · ${w} incorrect · ${b} unanswered`;$('review').innerHTML='';S.items.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let a=S.a[i];d.innerHTML=`<b>${i+1}. ${q.question}</b><br><span class="muted">Your answer: ${a==null?'—':L[a]+'. '+q.c[a].t}</span>${a===q.cp?'':`<br><span>Correct: ${L[q.cp]}. ${q.c[q.cp].t}</span>`}`;$('review').appendChild(d)});show('results');$('retry').disabled=(w+b)===0}$('start').onclick=()=>start();$('prev').onclick=()=>{if(S.i){S.i--;render()}};$('next').onclick=()=>{if(S.i<S.items.length-1){S.i++;render()}};$('finish').onclick=finish;$('again').onclick=()=>show('setup');$('retry').onclick=()=>{let m=S.items.filter((q,i)=>S.a[i]!==q.cp).map(q=>window.BANK.find(x=>x.id===q.id));start(m,m.length)};</script></body></html>
